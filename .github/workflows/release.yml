name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    # OIDC trusted publishing (Fix 14): the publish step does NOT use a
    # long-lived TWINE_API_TOKEN. Instead, GitHub mints a short-lived OIDC
    # token that PyPI verifies against this repo's trusted publisher config.
    # Requires the project to be configured as a trusted publisher on PyPI
    # (https://pypi.org/manage/project/zero-data-model/settings/publishing/).
    permissions:
      contents: write
      id-token: write  # required for OIDC trusted publishing to PyPI

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        # `twine` is no longer needed -- the pypa action uploads via OIDC.
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build distributions
        run: python -m build

      - name: Publish to PyPI (OIDC trusted publishing)
        # No API token: the action exchanges the repo's OIDC identity for a
        # short-lived upload token. Configure the trusted publisher on PyPI
        # once; after that no secrets are required for releases.
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
