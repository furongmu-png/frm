name: Benchmark

on:
  schedule:
    # Weekly, Sunday 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Run performance benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.13-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.13-

      - name: Install package with extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[quantum,jit,parallel]"

      - name: Run benchmark
        run: |
          mkdir -p benchmark_results
          python benchmark.py 2>&1 | tee benchmark_results/benchmark.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results/
          if-no-files-found: error
