name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Don't cancel sibling matrix jobs when one fails -- a 3.13 failure
      # shouldn't hide a 3.12 regression (Fix 15).
      fail-fast: false
      matrix:
        # 3.12 added per the audit (Fix 15); 3.11/3.13/3.14 cover the
        # supported floor, latest stable, and the prerelease track.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install package with extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,quantum,jit,parallel,web]"
          pip install pytest-cov

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --cov=src/zero_data_model \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -q

      - name: Upload coverage to Codecov
        # CODECOV_TOKEN must be configured in the repo secrets.
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Lint with ruff
        run: ruff check src/ tests/

  security:
    # Standalone security scanning job (Fix 15). Runs pip-audit for known
    # CVEs in installed dependencies and bandit for common Python code
    # security issues. Both must pass for the workflow to be green.
    name: Security (pip-audit + bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # required to upload SARIF results (O-LOW-40)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package + security tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,quantum,jit,parallel]"
          pip install pip-audit bandit

      - name: pip-audit (known-vulnerability scan of installed deps)
        # SARIF output for upload; never fail the job on findings (O-LOW-40).
        run: pip-audit -f sarif -o pip-audit.sarif || true

      - name: bandit (static security analysis of src/)
        # SARIF output for upload; never fail the job on findings (O-LOW-40).
        run: bandit -r src/ -f sarif -o bandit.sarif -q || true

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: |
            bandit.sarif
            pip-audit.sarif
