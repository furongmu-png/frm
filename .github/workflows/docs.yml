name: Docs

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "src/zero_data_model/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "src/zero_data_model/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install mkdocs + mkdocstrings
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Install package (so mkdocstrings can import zero_data_model)
        run: |
          # Install the package without optional extras; mkdocstrings only
          # needs the importable Python objects, not the web/quantum stack.
          # numpy/scipy are required core deps and will be pulled in.
          pip install -e .

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Upload site artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-site
          path: site/
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install mkdocs + mkdocstrings
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Install package
        run: pip install -e .

      - name: Build site
        run: mkdocs build

      - name: Deploy to gh-pages
        run: mkdocs gh-deploy --force --no-history
