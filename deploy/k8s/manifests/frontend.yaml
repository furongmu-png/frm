# Frontend: nginx serving static files. A static-only nginx.conf is mounted
# from a ConfigMap because the image's baked-in config references the compose
# service name "backend" (which does not resolve in K8s). The Ingress routes
# /api and /ws directly to the backend Service.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zdm-frontend-nginx
  namespace: zdm
  labels:
    app.kubernetes.io/name: zero-data-model
    app.kubernetes.io/component: frontend
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            expires 1h;
            add_header Cache-Control "public";
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zdm-frontend
  namespace: zdm
  labels:
    app.kubernetes.io/name: zero-data-model
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: zero-data-model
      app.kubernetes.io/component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zero-data-model
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: frontend
          image: zero-data-model-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: nginx-config
          configMap:
            name: zdm-frontend-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: zdm-frontend
  namespace: zdm
  labels:
    app.kubernetes.io/name: zero-data-model
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: zero-data-model
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
