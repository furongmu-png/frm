{{- /* Non-sensitive runtime configuration for the backend. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zdm.fullname" . }}-backend
  namespace: {{ include "zdm.namespace" . }}
  labels:
    {{- include "zdm.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  {{- range $key, $val := .Values.backend.env }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
---
# nginx config for the frontend. The image's baked-in nginx.conf proxies
# /api and /ws to the compose service name "backend", which does not resolve
# in Kubernetes. Because the Ingress already routes /api and /ws directly to
# the backend Service, the frontend only needs to serve static files here.
# This ConfigMap is mounted over /etc/nginx/conf.d/default.conf.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zdm.fullname" . }}-frontend-nginx
  namespace: {{ include "zdm.namespace" . }}
  labels:
    {{- include "zdm.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback — serve index.html for client-side routes.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Static assets cached aggressively.
        location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            expires 1h;
            add_header Cache-Control "public";
        }
    }
