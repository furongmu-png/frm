{{- /*
Sensitive values for the backend (API key, tokens). Only entries with a
non-empty value are rendered. In production prefer an external secret
manager (Sealed Secrets / External Secrets / Vault) over plain Secrets.
*/ -}}
{{- $hasSecrets := false -}}
{{- range $key, $val := .Values.backend.secret -}}
{{- if $val -}}{{- $hasSecrets = true -}}{{- end -}}
{{- end -}}
{{- if $hasSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zdm.fullname" . }}-backend
  namespace: {{ include "zdm.namespace" . }}
  labels:
    {{- include "zdm.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  {{- range $key, $val := .Values.backend.secret }}
  {{- if $val }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
{{- end }}
