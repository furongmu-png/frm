[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-data-model"
version = "0.2.0"
description = "Zero-data cognitive model: active inference, quantum-hybrid, and cross-domain capabilities."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
quantum = ["qiskit>=1.0"]
jit = ["numba>=0.58"]
parallel = ["joblib>=1.3"]
gpu = ["cupy-cuda12x"]
web = ["fastapi>=0.100", "uvicorn>=0.20", "pydantic>=2"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.1", "line_profiler"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
