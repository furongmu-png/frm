[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-data-model"
version = "0.2.0"
description = "Zero-data cognitive model: active inference, quantum-hybrid, and cross-domain capabilities."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
quantum = ["qiskit>=1.0"]
ibm = ["qiskit-ibm-runtime>=0.20"]
jit = ["numba>=0.58"]
parallel = ["joblib>=1.3"]
gpu = ["cupy-cuda12x"]
web = ["fastapi>=0.100", "uvicorn>=0.20", "pydantic>=2"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.1", "line_profiler"]
all = [
    "qiskit>=1.0",
    "qiskit-ibm-runtime>=0.20",
    "numba>=0.58",
    "joblib>=1.3",
    "cupy-cuda12x",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "pydantic>=2",
    "mcp>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Real-correctness + modernization rules. Docstring (D) and annotation (ANN)
# rules are intentionally NOT selected — they are style preferences, not
# correctness checks, and would require large stylistic rewrites.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
# E501 (line too long) is intentionally NOT ignored — long lines are fixed.

[tool.ruff.lint.per-file-ignores]
# Re-exports in package __init__ files are intentional public API surface.
"__init__.py" = ["F401"]
"**/__init__.py" = ["F401"]
