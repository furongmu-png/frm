[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-data-model"
version = "0.2.1"
description = "Zero-data cognitive model: active inference, quantum-hybrid, and cross-domain capabilities."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core numeric stack. Upper bounds on the major version guard against
    # breaking changes (Fix 20) -- numpy 3.x and scipy 2.x are not yet
    # released at the time of writing but the caps make intent explicit.
    # Round-5 audit NEW5-1: lower bound bumped to 1.25 because
    # ``Generator.spawn`` (used in ``ZeroDataModel.__init__`` to give each
    # cognitive module a bit-stream-independent child RNG) was added in
    # NumPy 1.25. On 1.24 the model raises ``AttributeError`` at import time.
    "numpy>=1.25,<3",
    "scipy>=1.10,<2",
]

[project.optional-dependencies]
# Quantum stack: Qiskit 1.x / 2.x are supported; 3.x is not yet released.
quantum = ["qiskit>=1.0,<3"]
ibm = ["qiskit-ibm-runtime>=0.20,<1"]
# JIT acceleration: numba tracks numpy closely; cap below 1.0.
jit = ["numba>=0.58,<1"]
# Parallel execution: joblib 2.x may change the backend API.
parallel = ["joblib>=1.3,<2"]
# GPU acceleration: cupy-cuda12x follows CUDA 12.x. Pin to a known-good
# range; the lower bound matches the first cuda12x wheel series.
gpu = ["cupy-cuda12x>=13.0,<15"]
# Web API: FastAPI 0.100+ has the modern dependency-injection API;
# pydantic 2.x is required for Field(min_length=, pattern=) constraints.
# slowapi/structlog/prometheus are optional observability/rate-limit deps
# (Fixes 7, 8, 9) -- the API degrades gracefully when they are absent.
web = [
    "fastapi>=0.100,<1",
    "uvicorn>=0.20,<1",
    "websockets>=12,<17",
    "pydantic>=2,<3",
    "slowapi>=0.1,<1",
    "structlog>=24,<27",
    "prometheus-fastapi-instrumentator>=6,<9",
]
mcp = ["mcp>=1.0,<2"]
# Dev tooling: pytest 7+/8, ruff 0.x, line_profiler 5.x (Fix 20),
# hypothesis 6.x for property-based invariant tests (Round-3 audit
# C-batch). httpx is required by fastapi.testclient.TestClient used in
# the API + phase-integration test suites (test_api_emergence,
# test_phase{6,7}_*_integration). Without it declared here, CI installs
# (which start from a clean environment) silently skip those tests via
# pytest.importorskip, masking real regressions (Phase D dep fix).
dev = [
    "pytest>=7,<9",
    "pytest-cov>=4,<8",
    "ruff>=0.1,<1",
    "line_profiler>=4,<6",
    "hypothesis>=6,<7",
    "httpx>=0.24,<1",
]
all = [
    "qiskit>=1.0,<3",
    "qiskit-ibm-runtime>=0.20,<1",
    "numba>=0.58,<1",
    "joblib>=1.3,<2",
    "cupy-cuda12x>=13.0,<15",
    "fastapi>=0.100,<1",
    "uvicorn>=0.20,<1",
    "pydantic>=2,<3",
    "slowapi>=0.1,<1",
    "structlog>=24,<27",
    "prometheus-fastapi-instrumentator>=6,<9",
    "mcp>=1.0,<2",
    "pytest>=7,<9",
    "pytest-cov>=4,<8",
    "ruff>=0.1,<1",
    "line_profiler>=4,<6",
    "hypothesis>=6,<7",
    "httpx>=0.24,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Phase G (五.3): performance benchmarks are tagged with `perf` so they can
# be skipped on quick CI runs (`-m "not perf"`) or run in isolation
# (`-m perf`). They have soft thresholds that depend on host load and may
# be flaky on shared runners, hence the opt-in marker.
markers = [
    "perf: performance benchmarks (S4 <1ms, Hopfield <2ms, think() <+20%)",
    "slow: long-running stress tests (20000 steps, full-system integration)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Real-correctness + modernization rules. Docstring (D) and annotation (ANN)
# rules are intentionally NOT selected — they are style preferences, not
# correctness checks, and would require large stylistic rewrites.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
# E501 (line too long) is intentionally NOT ignored — long lines are fixed.

[tool.ruff.lint.per-file-ignores]
# Re-exports in package __init__ files are intentional public API surface.
"__init__.py" = ["F401"]
"**/__init__.py" = ["F401"]

[tool.mypy]
# 使用 3.12 而非 3.10：已安装的 numpy 2.x 自带 .pyi 使用 PEP 695 ``type``
# 语句（仅 3.12+ 可解析）。项目 requires-python>=3.10 且 CI 测试 3.11–3.14，
# 设为 3.12 不会影响对新模块 stub 的类型检查。
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # 渐进式：先不强制所有函数有类型注解
check_untyped_defs = true
ignore_missing_imports = true  # numpy/scipy 等第三方 stubs 可能缺失
# 只报告显式传入的模块（7 个新模块包）的错误，抑制传递导入的旧模块
# （model/mcp_server/capabilities/hardware 等，本任务范围外）的既有错误。
follow_imports = "silent"

# 将 numpy 视为 Any：避免 bare ``np.ndarray`` 在 strict 模式下触发
# disallow_any_generics（numpy stub 把 ndarray 定义为带型参的泛型）。
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

# 旧 hardware 包的 __init__.pyi 有一个既有 [no-redef] 错误（本任务范围外）。
# skip 比 silent 更强：跳过对该 .pyi 的语义检查，避免阻断新模块的类型检查。
[[tool.mypy.overrides]]
module = ["zero_data_model.hardware", "zero_data_model.hardware.*"]
follow_imports = "skip"

# 新认知升级模块包要求严格类型检查（已补齐 .pyi stubs）。
[[tool.mypy.overrides]]
module = "zero_data_model.cogmem.*"
strict = true

[[tool.mypy.overrides]]
module = "zero_data_model.cogtime.*"
strict = true

[[tool.mypy.overrides]]
module = "zero_data_model.plasticity.*"
strict = true

[[tool.mypy.overrides]]
module = "zero_data_model.knowledge.*"
strict = true

[[tool.mypy.overrides]]
module = "zero_data_model.metacog.*"
strict = true

[[tool.mypy.overrides]]
module = "zero_data_model.experiment.*"
strict = true

[[tool.mypy.overrides]]
module = "zero_data_model.multiagent.*"
strict = true

# Phase 3 新增模块包要求严格类型检查（已补齐 .pyi stubs）。
[[tool.mypy.overrides]]
module = "zero_data_model.tools.*"
strict = true

[[tool.mypy.overrides]]
module = "zero_data_model.observability.*"
strict = true
