version: "3.9"
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
      - "8765:8765"
    volumes:
      - model-data:/app/experiments/output
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 认知起源完整演示服务（一键跑 demo + 生成视频素材）
  # 默认不启动；显式 `docker compose up demo` 触发
  demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
    profiles: ["demo"]
    volumes:
      - demo-output:/app/demo_output
      - demo-video:/app/video_assets
    environment:
      - PYTHONUNBUFFERED=1
      - MPLBACKEND=Agg
    # 默认运行中等规模 demo + 生成视频
    # 可通过 `docker compose run demo python demo_cognitive_origin.py --steps 5000` 覆盖
    command: >
      sh -c "
        python demo_cognitive_origin.py --steps 1000 --no-streamer --output demo_output &&
        python build_material_index.py --input demo_output --out video_assets &&
        python render_demo_video.py --input demo_output --out video_assets
      "

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    volumes:
      - frontend-dist:/usr/share/nginx/html
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
      - frontend-dist:/srv/frontend:ro
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  model-data:
  caddy-data:
  caddy-config:
  frontend-dist:
  demo-output:
  demo-video:
